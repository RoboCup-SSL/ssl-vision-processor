repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix gui/frontend run lint
        language: system
        files: ^gui/frontend/
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix gui/frontend run format:check
        language: system
        files: ^gui/frontend/
        pass_filenames: false
