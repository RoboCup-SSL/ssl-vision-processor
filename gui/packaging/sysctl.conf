# Installed by rcssl-vision-processor-gui. A live video keyframe is bigger
# than Linux's default limit on a socket's receive buffer, and the GUI isn't
# told when its buffer is capped: the video just stutters or breaks up.
#
# To set it higher, use a file in /etc/sysctl.d that sorts after this one,
# such as 90-local.conf.
net.core.rmem_max = 4194304
