name: Release

# Pushing a v* tag publishes that version of the GUI host: the static binary,
# its tarball and SHA256SUMS, as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gui:
    name: Release (gui)
    runs-on: ubuntu-latest
    steps:
      # The version comes from git describe, which needs the tags.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build and check
        run: nix develop --command bash -c 'cd gui && make release-check VERSION="$GITHUB_REF_NAME"'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            gui/bin/release/*.tar.gz gui/bin/release/*-bin gui/bin/release/SHA256SUMS
