name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (nix)
    runs-on: ubuntu-latest
    steps:
      # The protocol definitions are a submodule; without them CMake fails at
      # configure time with the "run git submodule update" message.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build all targets
        run: |
          nix develop --command bash -c '
            cmake -B build .
            make -C build -j"$(nproc)" vision_processor geometry_benchmark blob_benchmark
          '

  build-apt:
    name: Build (Ubuntu 24.04, apt)
    # Pinned, not ubuntu-latest: 24.04 is the release target, and its packages
    # (protobuf 3.21, OpenCV 4.6, ffmpeg 6.1) are far older than nixpkgs'.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # setup.sh's Debian package list, minus its runtime-only and Python
      # packages. Keep the two in sync.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libyaml-cpp-dev \
            ocl-icd-opencl-dev libeigen3-dev libopencv-dev protobuf-compiler libprotobuf-dev \
            libavcodec-dev libavformat-dev libavutil-dev libdc1394-dev

      - name: Build all targets
        run: |
          cmake -B build .
          make -C build -j"$(nproc)" vision_processor geometry_benchmark blob_benchmark

  python:
    name: Python (wrapper_backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Importing wrapper_backend runs protoc against the submodule and
      # generates wrapper_backend/proto/, which mypy needs on its path even
      # though it excludes the generated files themselves.
      - name: Lint and type check
        run: |
          nix develop --command bash -c '
            uv sync --locked
            uv run python -c "import wrapper_backend"
            uv run ruff check wrapper_backend/
            uv run ruff format --check wrapper_backend/
            uv run mypy
          '

  frontend:
    name: Frontend (wrapper-frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wrapper-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrapper-frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run check

      - run: npm run build
