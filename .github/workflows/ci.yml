name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same PR makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (nix)
    runs-on: ubuntu-latest
    steps:
      # The protocol definitions are a submodule; without them CMake fails at
      # configure time with the "run git submodule update" message.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build all targets
        run: |
          nix develop --command bash -c '
            cmake -B build .
            make -C build -j"$(nproc)" vision_processor geometry_benchmark blob_benchmark
          '

  build-apt:
    name: Build (Ubuntu 24.04, apt)
    # Pinned, not ubuntu-latest: 24.04 is the release target, and its packages
    # (protobuf 3.21, OpenCV 4.6, ffmpeg 6.1) are far older than nixpkgs'.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # setup.sh's Debian package list, minus its runtime-only and Python
      # packages. Keep the two in sync.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libyaml-cpp-dev \
            ocl-icd-opencl-dev libeigen3-dev libopencv-dev protobuf-compiler libprotobuf-dev \
            libavcodec-dev libavformat-dev libavutil-dev libdc1394-dev

      - name: Build all targets
        run: |
          cmake -B build .
          make -C build -j"$(nproc)" vision_processor geometry_benchmark blob_benchmark

  gui-go:
    name: Go (gui)
    runs-on: ubuntu-latest
    steps:
      # gui/internal/{vision,gamecontroller} are generated, not committed (see
      # gui/buf.gen.yaml) -- the proto/ submodule and a `buf generate` (via
      # `make .proto`, local plugins, no network needed) are needed before
      # anything here builds.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # The socket tests send real multicast over loopback, which Ubuntu
      # ships with multicast off. They fail rather than skip under CI, so a
      # missing step here can't hide as a skip.
      - name: Enable loopback multicast
        run: sudo scripts/lo-multicast.sh on

      - name: Format, vet, build, test
        run: |
          nix develop --command bash -c '
            cd gui
            make fmt-check
            make vet
            make build
            make go-test
            make generate-check
          '

  gui-apt:
    name: Go and frontend (gui, Ubuntu 24.04, no nix)
    # The non-nix counterpart of gui-go and frontend: the same make targets,
    # with every tool from its own pin instead of the flake. Formatting and
    # generated-file checks stay in the nix jobs; this job only shows the GUI
    # builds and passes its tests with these tool versions.
    runs-on: ubuntu-24.04
    env:
      # As in the flake: a go.mod newer than the installed Go fails here
      # instead of quietly downloading a toolchain.
      GOTOOLCHAIN: local
    steps:
      # The package version counts commits, which needs the history.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version-file: gui/frontend/.nvmrc
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # Ubuntu doesn't package buf. Keep the version in step with the flake's
      # (nix develop -c buf --version) and gui/DEVELOPMENT.md.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.72.0

      - name: Enable loopback multicast
        run: sudo scripts/lo-multicast.sh on

      - name: Build and test
        working-directory: gui
        run: |
          make build
          make go-test
          make frontend-test

      # nfpm is a Go tool, so the packages build the same way without nix.
      - name: Packages
        working-directory: gui
        run: make deb

  gui-release:
    name: Release build (gui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # A first run publishes nothing, so this can't disturb anything.
      - name: Build it and run it as a new user would
        run: nix develop --command bash -c 'cd gui && make release-check'

  gui-deb:
    name: Debian packages (gui)
    # The runner is a real Ubuntu 24.04 machine with systemd, so this installs
    # the package and checks the service itself, not just the files.
    runs-on: ubuntu-24.04
    steps:
      # The package version counts commits, which needs the history.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop --command bash -c 'cd gui && make deb'

      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error,warning gui/bin/deb/*.deb

      - name: Install and check the service
        run: sudo gui/scripts/deb-check.sh gui/bin/deb/*_amd64.deb "$(git -C gui describe --tags --always --dirty)"

  frontend:
    name: Frontend (gui/frontend)
    runs-on: ubuntu-latest
    steps:
      # frontend/src/proto is generated, not committed (see gui/buf.gen.yaml)
      # -- this job now needs the proto/ submodule and buf/go (hence nix,
      # same as gui-go) to produce it before npm can build against it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Lint, check, build
        run: |
          nix develop --command bash -c '
            cd gui
            make frontend-test
            make frontend
          '

  gui-e2e:
    name: End-to-end (gui)
    runs-on: ubuntu-latest
    steps:
      # Same prerequisites as gui-go: generated protobuf and the frontend
      # build, both via nix. The browser is the runner's own Google Chrome
      # (Playwright's "chrome" channel), so nothing is downloaded for it.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Smoke tests
        run: |
          nix develop --command bash -c '
            cd gui
            make e2e
          '

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: gui/frontend/test-results/
          retention-days: 7
